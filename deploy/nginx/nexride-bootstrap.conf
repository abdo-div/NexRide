server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    access_log /var/log/nginx/nexride.bootstrap.access.log;
    error_log /var/log/nginx/nexride.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Do not expose the application before the certificate and final proxy
    # configuration are installed.
    location / {
        return 503;
    }
}
