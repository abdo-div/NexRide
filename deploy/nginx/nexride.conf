# This file is loaded inside Nginx's `http` context on Debian/Ubuntu.
# Query strings are deliberately excluded because payment callbacks and other
# URLs can carry credentials. Password-reset token paths are not logged at all.
log_format nexride_safe '$remote_addr [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        'rt=$request_time urt=$upstream_response_time';

map $uri $nexride_loggable {
    default 1;
    /health/liveness 0;
    ~^/(?:api/v1/users/)?reset(?:-|[Pp])assword/ 0;
}

upstream nexride_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://YOUR_DOMAIN$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NexRideSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/nexride.access.log nexride_safe if=$nexride_loggable;
    error_log /var/log/nginx/nexride.error.log warn;

    # Eight vehicle images at 5 MiB each plus multipart overhead fit below this
    # ceiling. Nginx buffers uploads before forwarding them to Node.
    client_max_body_size 48m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    location / {
        proxy_pass http://nexride_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        proxy_hide_header X-Powered-By;
    }
}
