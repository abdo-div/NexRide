# NexRide single-VPS Redis configuration (Redis 7+).
# Install as /etc/redis/redis.conf and keep it owned by root:redis, mode 0640.

# Redis is an internal service. Nginx and the public network never reach it.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised systemd
pidfile /run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
always-show-logo no

# The default user is disabled in the ACL file. NexRide authenticates as a
# named user whose key and channel access is limited to the nexride namespace.
aclfile /etc/redis/nexride.acl
databases 1

# RDB snapshots provide compact recovery points. AOF with every-second fsync
# preserves BullMQ jobs and short-lived coordination state across restarts.
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Queue and lock keys must never disappear silently. Size this value for the
# VPS, leaving enough RAM for Redis fork/rewrite overhead, MongoDB, Node, and
# the operating system. See docs/VPS_REDIS.md before changing it.
maxmemory 512mb
maxmemory-policy noeviction

slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
notify-keyspace-events ""

