name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend-checks:
    name: Frontend typecheck, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  release-artifact:
    name: Build immutable release artifact
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Package committed backend and built frontend
        run: sh deploy/release/package.sh "$RUNNER_TEMP/nexride-release" "$GITHUB_SHA"
      - name: Upload release and checksum
        uses: actions/upload-artifact@v4
        with:
          name: nexride-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nexride-release/nexride-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/nexride-release/nexride-${{ github.sha }}.tar.gz.sha256
            ${{ runner.temp }}/nexride-release/deploy.sh
            ${{ runner.temp }}/nexride-release/rollback.sh
          if-no-files-found: error
          retention-days: 30
